# Toolforge Jobs framework definitions (docs/RUNBOOK.md).
# Load/refresh with:  toolforge jobs load ~/repo/jobs.yaml
#
# Every command below starts with `exec`. The jobs framework wraps whatever is
# written here as
#   /bin/sh -c -- 'exec 1>>NAME.out; exec 2>>NAME.err; <command>'
# and Kubernetes signals only PID 1 at the timeout. Without `exec` that PID 1
# is the wrapper shell, which has no trap and does not forward the signal to a
# foreground child, so the real process is never asked to stop -- it is killed
# outright once the 15s grace period runs out. `exec` replaces the wrapper
# instead of forking under it, which is what puts job_guard.sh at PID 1 and
# makes its lock-releasing signal handlers reachable at all.
---
- name: crawler
  # Hourly toolinfo crawl: fetches every registered URL, validates records,
  # upserts locally-registered tools (skipping names that exist upstream).
  command: exec $HOME/repo/tools/job_guard.sh --job-name crawler -- $HOME/www/python/venv/bin/python $HOME/repo/proxy/crawl.py
  image: python3.13
  schedule: "17 * * * *"
  emails: onfailure

- name: toolinfo-discovery
  # Background discovery for official Toolhub tools: walk /api/tools/ pages,
  # check root /toolinfo.json first, then same-origin sitemap.xml entries.
  # Keep it off the request path, but scan a large enough window that the
  # official catalog converges quickly across repeated runs.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name toolinfo-discovery -- /usr/bin/env TOOLINFO_DISCOVERY_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/toolinfo_discovery.py
  image: python3.13
  schedule: "37 */6 * * *"
  emails: onfailure

- name: toolinfo-source-index
  # Background source index for official Toolhub crawler URLs: mirror
  # /api/crawler/urls/, fetch each registered feed, and map tool names back to
  # the feed Toolhub crawls. This is canonical provenance evidence; root/sitemap
  # discovery remains a secondary self-hosted metadata check.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name toolinfo-source-index -- /usr/bin/env TOOLINFO_SOURCE_INDEX_LIMIT=150 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/toolinfo_sources.py
  image: python3.13
  schedule: "11 */6 * * *"
  emails: onfailure

- name: source-attestations
  # Cheap local incremental repair for content and stable-identity changes.
  # A rules-version change automatically promotes the next run to a full audit.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name source-attestations --stale-after 1800 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/source_attestations.py
  image: python3.13
  schedule: "29 */6 * * *"
  timeout: 900
  emails: onfailure

- name: catalog-sync
  # Initial backfill: five 100-record pages every 15 minutes. After the first
  # cycle, consume recent changes, hydrate up to twenty graph candidates, and
  # reconcile one page every 12 hours, with three seconds between requests.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-sync --stale-after 600 -- /usr/bin/env CATALOG_SYNC_PAGES=5 CATALOG_SYNC_PAGE_SIZE=100 CATALOG_SYNC_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_sync.py
  image: python3.13
  schedule: "*/15 * * * *"
  timeout: 300
  emails: onfailure

- name: list-revision-sync
  # Name the tools each recent list revision added or removed. The recent feed
  # says only "Added tool to list"; the name is in the revision diff, one
  # request per revision, which is why a reader cannot be made to wait for it.
  # Seven minutes behind catalog-sync so it works on revisions that run just
  # replicated, and capped per run: the first pass faces the whole backlog,
  # every later one only what appeared in the last quarter hour.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name list-revision-sync --stale-after 600 -- /usr/bin/env LIST_REVISION_LIMIT=60 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/list_revision_sync.py
  image: python3.13
  schedule: "7,22,37,52 * * * *"
  timeout: 300
  emails: onfailure

- name: catalog-integrity
  # A complete consistency-checked snapshot is an integrity backstop, not the
  # normal ingestion path. Twice monthly is close to a two-week cadence while
  # keeping the schedule deterministic across month boundaries.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-integrity --stale-after 3600 -- /usr/bin/env CATALOG_SYNC_PAGE_SIZE=100 CATALOG_SYNC_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_sync.py --complete
  image: python3.13
  schedule: "17 3 1,15 * *"
  timeout: 1800
  emails: onfailure

- name: projection-refresh
  # Refresh independent official inputs concurrently, then publish one atomic
  # identity/source projection and precompute catalog statistics. Fresh inputs
  # are reused, so a scheduled run can be a cheap verified no-op.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name projection-refresh --stale-after 3600 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/projection_refresh.py
  image: python3.13
  schedule: "41 */6 * * *"
  timeout: 1800
  emails: onfailure

- name: statistics-refresh
  # /statistics serves one precomputed document. This has to run more often
  # than catalog_statistics.SNAPSHOT_MAX_AGE, or the page advertises a
  # freshness it never has and a visitor ends up rebuilding it inside their
  # own request -- which is what OOM-killed the web service.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name statistics-refresh --stale-after 480 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/statistics_refresh.py
  image: python3.13
  schedule: "*/10 * * * *"
  timeout: 240
  emails: onfailure

- name: source-attestations-full
  # Weekly full audit is the backstop for rule/dependency bugs; ordinary feed
  # and identity changes use the incremental content-hash path above.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name source-attestations-full --stale-after 1800 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/source_attestations.py --full
  image: python3.13
  schedule: "19 4 * * 0"
  timeout: 900
  emails: onfailure

- name: maintainer-backfill
  # Backfill public Toolsadmin maintainer evidence for cached Toolforge tools.
  # One request is spaced at least three seconds from the previous request;
  # the cursor advances after every tool and retries failures next cycle.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name maintainer-backfill --stale-after 600 -- /usr/bin/env MAINTAINER_BACKFILL_LIMIT=60 MAINTAINER_BACKFILL_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/maintainer_backfill.py
  image: python3.13
  schedule: "13 * * * *"
  timeout: 300
  emails: onfailure

- name: phabricator-realname-sync
  # Read the public Phabricator profile of developer handles this project
  # already holds, so catalog author labels carrying a real name can match.
  # Only /p/<username>/ is requested, one handle at a time, two seconds apart;
  # a known pair is re-read after 90 days and an absent one after a year, so a
  # steady-state cycle spends almost no requests.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name phabricator-realname-sync --stale-after 1200 -- /usr/bin/env PHABRICATOR_REALNAME_LIMIT=60 PHABRICATOR_REALNAME_MIN_INTERVAL_SECONDS=2 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/phabricator_realname_sync.py
  image: python3.13
  schedule: "31 * * * *"
  timeout: 600
  emails: onfailure

- name: repository-analysis
  # Continuous rather than hourly. An hourly batch of 100 spent most of its
  # budget re-checking repositories that had not moved, so a cold catalog
  # drained at whatever was left over and a newly registered tool waited for
  # the top of the hour. Two lanes at their own rates instead: not-yet-analyzed
  # repositories every second, so the backlog and new tools clear quickly, and
  # already-analyzed ones every minute, which is only a HEAD comparison and
  # only needs to notice movement. Both are minimum spacings between starts; a
  # slow clone delays the next start rather than overlapping it.
  #
  # No job_guard.sh here, deliberately. The guard exists for scheduled jobs: it
  # holds an overlap lock it reclaims after --stale-after, which a process that
  # never exits would keep tripping, and it trips a breaker after three
  # consecutive failures, which under a restarting continuous job would exit 0
  # forever and turn a crash loop into a hot no-op loop. Kubernetes restarting
  # the pod is the supervisor here.
  #
  # 1Gi, down from the 2Gi the batch job needed. The clone is now bounded
  # (--depth 1, --filter=blob:limit, --no-checkout), which took the measured
  # cgroup peak over a 100-tool batch from 1.264Gi to 159.7Mi; 1Gi is ~6x that
  # headroom, and a continuous pod holds its allocation permanently rather than
  # for 15 minutes an hour. An OOM kill is also no longer self-perpetuating:
  # the attempt is stamped before the clone, so a killed tool sorts to the back
  # instead of being reselected first on every restart.
  command: exec /usr/bin/env REPOSITORY_SCAN_CONTINUOUS=1 REPOSITORY_SCAN_BACKLOG_INTERVAL=1 REPOSITORY_SCAN_REFRESH_INTERVAL=60 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/repository_scan.py
  image: python3.13
  continuous: true
  mem: 1Gi
  emails: onfailure

- name: repository-enrichment
  # The other half of repository-analysis: what the hosts publish, which a
  # depth-1 clone structurally cannot see. Scheduled and bounded rather than
  # continuous, because this lane is rate bound where the scanner is disk
  # bound, and it spends TOOLHUB_GITHUB_TOKEN -- the same credential that
  # publishes user-submitted issue reports.
  #
  # Hourly at :20, away from the :55 and :58 sweeps, so the three do not
  # contend. 200 repositories a pass, at most three requests each and usually
  # one (a poll of an unchanged repository is a conditional request, and a
  # GitHub 304 is not charged against the hourly limit at all). Worst case is
  # therefore ~600 of 5000, and the lane refuses to spend below a reserve of
  # 1000 regardless, so a person reporting an issue is never starved by a
  # background refresh.
  #
  # 512Mi: no clone, no checkout, no subprocess. It holds one bounded API
  # response at a time (1 MiB cap) and a batch of URLs.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name repository-enrichment --stale-after 1200 -- /usr/bin/env TOOLHUB_ENRICHMENT_LIMIT=200 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/repository_enrichment.py
  image: python3.13
  schedule: "20 * * * *"
  timeout: 600
  mem: 512Mi
  emails: onfailure

- name: graph-enrichment
  # Local-only repair and quality audit. Producer jobs materialize affected
  # tools immediately; this hourly sweep catches missed rows and rule-version
  # upgrades, then logs facet coverage and taxonomy regressions.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name graph-enrichment --stale-after 600 -- /usr/bin/env GRAPH_ENRICHMENT_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/graph_enrichment.py
  image: python3.13
  schedule: "55 * * * *"
  timeout: 300
  emails: onfailure

- name: catalog-projection
  # Repair/version-upgrade the Evolved-local provenance projection. Producer
  # jobs refresh changed tools immediately; this bounded sweep is the backstop.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-projection --stale-after 600 -- /usr/bin/env CATALOG_PROJECTION_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_projection.py
  image: python3.13
  schedule: "58 * * * *"
  timeout: 300
  emails: onfailure

- name: tool-assets
  # Fetch icons only in the background under outbound URL, type, and size
  # limits. The webservice serves cached bytes and never fetches on a read.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name tool-assets --stale-after 1200 -- /usr/bin/env TOOL_ASSET_LIMIT=100 TOOLHUB_ASSET_CACHE_DIR=/data/project/toolhub-evolved/data/icon-cache /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/tool_assets.py
  image: python3.13
  schedule: "7 * * * *"
  timeout: 600
  emails: onfailure

- name: catalog-validation
  # Probe effective public URLs under the shared SSRF/redirect guard. Results
  # are observations only; invalid official evidence remains preserved.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-validation --stale-after 1200 -- /usr/bin/env CATALOG_VALIDATION_LIMIT=200 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_validation.py
  image: python3.13
  schedule: "3 * * * *"
  timeout: 600
  emails: onfailure

- name: people-reconcile
  # Rebuild the deterministic people graph and typed relationships, reapply
  # durable approvals, and check a bounded set of unresolved labels for exact
  # Toolhub identity candidates. A dry run performs no external lookups.
  #
  # The 2026-08-16 pass took 28 minutes against the old 30-minute ceiling, and
  # the next one was killed at it. A pass that outgrows its timeout is worse
  # than a slow one: the platform SIGKILLs the pod, so the guard's EXIT trap
  # never releases the lock and its failure counter never records anything, and
  # the run is lost after doing most of the work. An hour of headroom costs
  # nothing on a weekly schedule. --stale-after stays at twice the timeout so a
  # lock abandoned by a kill is still reclaimed, and never one held by a run
  # that is merely slow.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-reconcile --stale-after 7200 -- /usr/bin/env /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --apply
  image: python3.13
  schedule: "13 5 * * 0"
  timeout: 3600
  emails: onfailure

- name: people-identity-reconcile
  # Resolve a bounded batch through Toolhub stable ids, CentralAuth, and
  # Toolforge SUL membership without repeating the full relationship rebuild.
  # Fresh unresolved candidates cool down for a day, so each run advances
  # through the population while transient failures are retried later.
  # PEOPLE_REGISTRY_LABEL_LIMIT resolves that many handle-shaped unresolved
  # labels against CentralAuth per run, four a second and serialized, walking a
  # cursor so every label gets a turn and unknown ones are retried once per
  # sweep. The fetcher sends maxlag and obeys Retry-After, so the service sets
  # the ceiling rather than a guessed delay. 1000 swept the 904-label backlog in
  # one 851s run, which left only 49s of the timeout; 500 is the steady-state
  # size now that only new labels arrive. It records identity only;
  # corroboration on a shared tool is what publishes anything.
  #
  # The timeout is twice what the sweep costs today, not a little above it. At
  # 900s it had stopped being a ceiling and become the usual outcome: runs were
  # landing at 879-889s and on 2026-08-22 the 15:43 and 16:43 runs were killed
  # at the deadline, which writes no summary and no run record, so the job
  # looked merely late. The remote batch is bounded by the limit above, but the
  # local scan that follows it grows with the catalog -- 24785 people and 27506
  # evidence rows on the last completed run -- so the cost only rises. Read
  # `phaseSeconds` in the job's own output before spending this headroom again:
  # if the local half is what grew, more time is the wrong answer twice running.
  #
  # 1500 rather than 1800 because --stale-after is derived from it and would
  # otherwise land on the schedule. A leaked lock is only ever inspected by a
  # run, so its age is a multiple of the hour; at --stale-after 3600 the first
  # inspection and the threshold coincide and jitter decides the outcome. The
  # 24 reclaims recorded in people-identity-reconcile.err range 3588-3613s, so
  # 10 of them would have skipped and waited another silent hour. 3000 is
  # inspected at 3600 with 600s to spare, and 1500 is still nearly twice the
  # 803s worst completed run.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-identity-reconcile --stale-after 3000 -- /usr/bin/env PEOPLE_IDENTITY_CANDIDATE_LIMIT=100 PEOPLE_REGISTRY_LABEL_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --identities-only
  image: python3.13
  schedule: "43 * * * *"
  timeout: 1500
  emails: onfailure

- name: people-attribution-reconverge
  # Re-decide stored unresolved attributions against evidence that arrived after
  # they were first judged. Corroboration is the one attribution rule whose
  # answer can change without its own observation changing, and nothing else
  # revisits it: an unresolved row otherwise waits for its source feed to be
  # re-ingested for that tool, which for most rows means the weekly full pass.
  # A rolling cursor makes coverage complete across passes, so an hourly bounded
  # batch is enough and no single run has to read the whole backlog.
  # It shares the people-reconcile advisory lock deliberately: concurrent
  # identity writers have deadlocked this table before. It waits up to 120s for
  # that lock rather than skipping on contact, which the per-minute drain still
  # does. Skipping assumed the next run an hour later would converge instead,
  # and against the per-minute drain that holds. It does not against the weekly
  # full pass, which holds the lock for longer than the gap between two runs of
  # this job: on 2026-08-17 five consecutive attempts were skipped. Waiting adds
  # no concurrency, so the deadlock reasoning above is unaffected, and 120s is
  # well inside the 600s timeout below.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-attribution-reconverge --stale-after 1200 -- /usr/bin/env PEOPLE_RECONVERGE_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --reconverge
  image: python3.13
  schedule: "21 * * * *"
  timeout: 600
  emails: onfailure

- name: people-reconcile-incremental
  # Process canonical and newly ingested tool changes shortly after their
  # write transaction. The weekly full pass remains the global backstop.
  # A run stopped at its timeout releases its own guard lock, and every
  # guarded job sets --stale-after to twice its own timeout as the backstop
  # for a run that is killed outright. This drain died on 2026-08-03 holding a
  # lock nobody released and no run happened for the next ten days.
  # The batch is sized to finish inside the timeout even from a cold backlog,
  # and small enough that its row locks do not sit across other identity
  # jobs: at 50 it held them for ~212s per run and deadlocked the source
  # audit and the maintainer backfill. Per-tool cost is unchanged, so
  # halving the batch halves the lock window at the same drain rate.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-reconcile-incremental --stale-after 600 -- /usr/bin/env PEOPLE_RECONCILE_QUEUE_LIMIT=25 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --queue
  image: python3.13
  schedule: "* * * * *"
  timeout: 300
  emails: onfailure

- name: api-cache-invalidator
  # Poll official Toolhub recent changes out of band, invalidate affected rows,
  # then prewarm hot anonymous reads so user requests never pay that cost.
  command: exec $HOME/repo/tools/job_guard.sh --job-name api-cache-invalidator -- $HOME/www/python/venv/bin/python $HOME/repo/proxy/cache_invalidation.py
  image: python3.13
  schedule: "* * * * *"
  emails: onfailure

- name: digest-publish
  # At 06:15 UTC, generate every missing closed, non-empty UTC period and
  # publish immutable daily/weekly/monthly editions plus the Meta archive.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name digest-publish --stale-after 3600 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/digest_publish.py
  image: python3.13
  schedule: "15 6 * * *"
  timeout: 1800
  emails: onfailure

- name: digest-deliver
  # Rebuild missing outbox rows and drain a bounded email/talk-page batch.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name digest-deliver --stale-after 600 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/digest_deliver.py
  image: python3.13
  schedule: "*/5 * * * *"
  timeout: 300
  emails: onfailure

- name: digest-audit
  # Turn durable publication failures and stale delivery backlogs into an
  # operator-visible failure email rather than trusting cron execution alone.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name digest-audit --stale-after 240 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/digest_audit.py
  image: python3.13
  schedule: "23 * * * *"
  timeout: 120
  emails: onfailure

- name: db-backup
  # Nightly ToolsDB dump with 14-day rotation (tools/backup-db.sh).
  # The mariadb image ships the client tools; check `toolforge jobs images`
  # if the image name changes.
  command: exec sh $HOME/repo/tools/job_guard.sh --job-name db-backup -- sh $HOME/repo/tools/backup-db.sh
  image: mariadb
  schedule: "45 2 * * *"
  emails: onfailure

- name: rotate-logs
  # Copy-truncate rotation for ~/uwsgi.log and every per-job .out/.err
  # (tools/rotate-logs.sh). Runs after db-backup so the two never contend for
  # the same disk window. Rotation cannot rename: uwsgi and the jobs framework
  # hold these files open and would keep writing to the rotated inode.
  command: exec sh $HOME/repo/tools/job_guard.sh --job-name rotate-logs -- sh $HOME/repo/tools/rotate-logs.sh
  image: python3.13
  schedule: "5 3 * * *"
  emails: onfailure

- name: wiki-registry
  # Which Wikimedia wikis exist, and which replica instance each one is on.
  # `meta_p.wiki` lists about a thousand of them and already omits the private
  # ones, so what it returns is exactly the set the censuses can read. One
  # connection, one read, into a local table the census lanes consult every
  # hour without touching the replicas for it.
  #
  # Weekly because that is the rate the answer changes at -- a wiki is created,
  # renamed or closed a few times a year -- not the rate it is needed at. A run
  # that cannot reach a replica reports read=0 and succeeds: the registry it
  # failed to update is still correct until a wiki is created, and failing here
  # would only add a red job to a week in which nothing was wrong.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name wiki-registry --stale-after 1800 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/wiki_registry_refresh.py
  image: python3.13
  schedule: "17 2 * * 1"
  emails: onfailure

- name: gadget-census
  # Gadget directory: read each wiki's MediaWiki:Gadgets-definition and turn
  # every gadget it declares into a catalogue record. The definition page is
  # the entire inventory, so this is one request per wiki -- unlike the
  # user-script census next to it, which is thousands and has to be asked for.
  # The catalogue pass that follows reads no wiki at all, so it also picks up
  # any change to what this codebase considers a tool on the next tick.
  #
  # No wiki list. Every readable Wikimedia wiki is covered, and which ones a
  # given run covers comes from the schedule: the wikis owed a turn, most
  # overdue first, grouped by replica instance. A wiki that keeps answering
  # "nothing moved" is asked less often and a wiki that changes every day is
  # asked more, which is how a thousand wikis fit in a budget sized for a
  # couple of hundred. Closed wikis drift out to a quarterly turn on their own.
  #
  # Every six hours rather than daily, because the unit of work is now a slice
  # of a queue rather than a fixed list: four half-hour runs a day cover four
  # times the wikis and leave the same three and a half hours of every six to
  # the two dozen jobs that share this database. GADGET_BUDGET_SECONDS is the
  # half-hour; it is checked between wikis, never during one, so a run may
  # overrun by the cost of its last wiki and never by more.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name gadget-census -- /usr/bin/env GADGET_BUDGET_SECONDS=1800 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/gadget_census.py
  image: python3.13
  schedule: "9 */6 * * *"
  emails: onfailure

- name: userscript-census
  # User-space script directory: enumerate every javascript/css content-model
  # page in User: space, store body and analysis, and record which pages load
  # which. On Toolforge the enumeration is one indexed read of the Wiki
  # Replicas, which is exact and uncapped; the CirrusSearch road is the fallback
  # for hosts with no replica.
  #
  # The hourly run follows recent changes. A full sweep is thousands of requests
  # and is asked for with USERSCRIPT_SWEEP=1 -- except that a wiki which has
  # never completed one, which is part-way through one, or whose census was
  # built on an enumeration road the host can now better, sweeps regardless.
  # That third case is how a wiki swept from the search index before the replica
  # road existed picks the replicas up; it costs one sweep per wiki, once,
  # because the sweep records the road it took and is then left alone.
  # USERSCRIPT_LIMIT bounds how many pages a single run reads, and the wiki's
  # sweep cursor carries the rest to the next run, so a corpus far larger than
  # one hour's budget converges over a day or two instead of timing out. 20000
  # titles is 400 content requests at CONTENT_BATCH=50, and the measured cost of
  # a run is what set it: 6000 per wiki across three wikis took under 7 minutes
  # of the hourly tick, so the budget that mattered was never the request count.
  # Three wikis at 20000 is ~1200 requests in roughly 20 minutes -- about one a
  # second while the job runs, which is why the census now sends maxlag and
  # stops when a wiki says it is behind rather than reading through the lag.
  #
  # No wiki list. Every readable Wikimedia wiki is covered, and which ones a
  # given run covers comes from the schedule: the wikis owed a turn, most
  # overdue first, grouped by replica instance so one connection per instance
  # serves the whole pass. A corpus nobody edits drifts out to a monthly turn
  # and a corpus edited hourly keeps its hourly one, which is what makes a
  # thousand corpora fit in a budget sized for the handful that move.
  #
  # USERSCRIPT_BUDGET_SECONDS is twenty minutes of the hour between runs, not
  # the whole hour: the replicas are shared with the gadget lane and the
  # database with two dozen other jobs, including a projection refresh that
  # averages nine minutes. It is checked between wikis and never during one --
  # a half-swept corpus is worse than a run that finished late -- so a run may
  # overrun by the cost of its last wiki and never by more. A wiki that fails
  # is recorded and backed off rather than failing the run; only every
  # attempted wiki failing does that, which is the shape of a real problem.
  #
  # An operator can still name wikis: USERSCRIPT_WIKIS=en.wikipedia.org with
  # USERSCRIPT_SWEEP=1 overrides the queue outright, which is how one big
  # corpus is swept on demand. Its 155,575 pages are why USERSCRIPT_LIMIT
  # exists: enwiki's first sweep runs for about 8 hourly runs, then the wiki
  # falls through to watching like every other.
  #
  # `python -u` because this job is killed rather than ended. Buffered stdout is
  # flushed when the process exits; a process that is SIGKILLed by a memory
  # limit never gets there, so every line the run had printed since its last
  # 8KB flush dies with it. That is not a small loss on a job whose whole
  # progress record is its own log: the enwiki failures below were invisible
  # for as long as they were because the log looked like a run that had never
  # reached the step, when it was a run whose account of reaching it was still
  # in a buffer. Unbuffered, the last line printed is the last line that ran.
  #
  # 2Gi rather than the cluster's 512Mi default, which is what was killing this.
  # Measured on the enwiki corpus at 56,206 candidates: the projection peaked at
  # 806MB before the fold was taught not to carry page bodies, and at 354MB
  # after -- and 512Mi sits between those two numbers, which is exactly why the
  # scheduled runs died silently while a probe with room to breathe got far
  # enough to report the real error. 85MB of the 354 is interpreter and imports;
  # the rest scales with the number of candidates, so enwiki's full 155,575
  # pages project to roughly 800MB and 1Gi would put us back where we started
  # within a few months of corpus growth. If enwiki outgrows 2Gi, the fix is to
  # fold in slices the way the ingest already does, not another doubling.
  command: exec /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name userscript-census -- /usr/bin/env USERSCRIPT_LIMIT=20000 USERSCRIPT_BUDGET_SECONDS=1200 /data/project/toolhub-evolved/www/python/venv/bin/python -u /data/project/toolhub-evolved/repo/proxy/userscript_sweep.py
  image: python3.13
  schedule: "23 * * * *"
  mem: 2Gi
  emails: onfailure
