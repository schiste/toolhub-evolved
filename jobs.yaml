# Toolforge Jobs framework definitions (docs/RUNBOOK.md).
# Load/refresh with:  toolforge jobs load ~/repo/jobs.yaml
---
- name: crawler
  # Hourly toolinfo crawl: fetches every registered URL, validates records,
  # upserts locally-registered tools (skipping names that exist upstream).
  command: $HOME/repo/tools/job_guard.sh --job-name crawler -- $HOME/www/python/venv/bin/python $HOME/repo/proxy/crawl.py
  image: python3.13
  schedule: "17 * * * *"
  emails: onfailure

- name: toolinfo-discovery
  # Background discovery for official Toolhub tools: walk /api/tools/ pages,
  # check root /toolinfo.json first, then same-origin sitemap.xml entries.
  # Keep it off the request path, but scan a large enough window that the
  # official catalog converges quickly across repeated runs.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name toolinfo-discovery -- /usr/bin/env TOOLINFO_DISCOVERY_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/toolinfo_discovery.py
  image: python3.13
  schedule: "37 */6 * * *"
  emails: onfailure

- name: toolinfo-source-index
  # Background source index for official Toolhub crawler URLs: mirror
  # /api/crawler/urls/, fetch each registered feed, and map tool names back to
  # the feed Toolhub crawls. This is canonical provenance evidence; root/sitemap
  # discovery remains a secondary self-hosted metadata check.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name toolinfo-source-index -- /usr/bin/env TOOLINFO_SOURCE_INDEX_LIMIT=150 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/toolinfo_sources.py
  image: python3.13
  schedule: "11 */6 * * *"
  emails: onfailure

- name: source-attestations
  # Cheap local incremental repair for content and stable-identity changes.
  # A rules-version change automatically promotes the next run to a full audit.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name source-attestations --stale-after 1800 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/source_attestations.py
  image: python3.13
  schedule: "29 */6 * * *"
  timeout: 900
  emails: onfailure

- name: catalog-sync
  # Initial backfill: five 100-record pages every 15 minutes. After the first
  # cycle, consume recent changes, hydrate up to twenty graph candidates, and
  # reconcile one page every 12 hours, with three seconds between requests.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-sync --stale-after 600 -- /usr/bin/env CATALOG_SYNC_PAGES=5 CATALOG_SYNC_PAGE_SIZE=100 CATALOG_SYNC_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_sync.py
  image: python3.13
  schedule: "*/15 * * * *"
  timeout: 300
  emails: onfailure

- name: catalog-integrity
  # A complete consistency-checked snapshot is an integrity backstop, not the
  # normal ingestion path. Twice monthly is close to a two-week cadence while
  # keeping the schedule deterministic across month boundaries.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-integrity --stale-after 3600 -- /usr/bin/env CATALOG_SYNC_PAGE_SIZE=100 CATALOG_SYNC_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_sync.py --complete
  image: python3.13
  schedule: "17 3 1,15 * *"
  timeout: 1800
  emails: onfailure

- name: projection-refresh
  # Refresh independent official inputs concurrently, then publish one atomic
  # identity/source projection and precompute catalog statistics. Fresh inputs
  # are reused, so a scheduled run can be a cheap verified no-op.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name projection-refresh --stale-after 3600 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/projection_refresh.py
  image: python3.13
  schedule: "41 */6 * * *"
  timeout: 1800
  emails: onfailure

- name: source-attestations-full
  # Weekly full audit is the backstop for rule/dependency bugs; ordinary feed
  # and identity changes use the incremental content-hash path above.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name source-attestations-full --stale-after 1800 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/source_attestations.py --full
  image: python3.13
  schedule: "19 4 * * 0"
  timeout: 900
  emails: onfailure

- name: maintainer-backfill
  # Backfill public Toolsadmin maintainer evidence for cached Toolforge tools.
  # One request is spaced at least three seconds from the previous request;
  # the cursor advances after every tool and retries failures next cycle.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name maintainer-backfill --stale-after 600 -- /usr/bin/env MAINTAINER_BACKFILL_LIMIT=60 MAINTAINER_BACKFILL_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/maintainer_backfill.py
  image: python3.13
  schedule: "13 * * * *"
  timeout: 300
  emails: onfailure

- name: phabricator-realname-sync
  # Read the public Phabricator profile of developer handles this project
  # already holds, so catalog author labels carrying a real name can match.
  # Only /p/<username>/ is requested, one handle at a time, two seconds apart;
  # a known pair is re-read after 90 days and an absent one after a year, so a
  # steady-state cycle spends almost no requests.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name phabricator-realname-sync --stale-after 1200 -- /usr/bin/env PHABRICATOR_REALNAME_LIMIT=60 PHABRICATOR_REALNAME_MIN_INTERVAL_SECONDS=2 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/phabricator_realname_sync.py
  image: python3.13
  schedule: "31 * * * *"
  timeout: 600
  emails: onfailure

- name: repository-analysis
  # Deterministically analyze up to 100 newly added or changed public repositories
  # per hour. The initial catalog backfill can be run manually with a larger limit.
  # Needs more than the default 512Mi: `git clone` resolving a large pack spikes
  # the whole pod past 1.2Gi for a few seconds, and the checkout cap only rejects
  # an oversized tree after the clone that produced it. Measured peak over one
  # 100-tool batch was 1.264Gi against steady-state 150Mi, so `kubectl top` never
  # shows it. A kill here is silent and permanent: the run dies before it can
  # record the tool, so the next run selects the same tool first and dies the same
  # way. That deadlock ran undetected from 2026-08-13 to 2026-08-17.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name repository-analysis --stale-after 1800 -- /usr/bin/env REPOSITORY_SCAN_LIMIT=100 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/repository_scan.py
  image: python3.13
  schedule: "47 * * * *"
  timeout: 900
  mem: 2Gi
  emails: onfailure

- name: graph-enrichment
  # Local-only repair and quality audit. Producer jobs materialize affected
  # tools immediately; this hourly sweep catches missed rows and rule-version
  # upgrades, then logs facet coverage and taxonomy regressions.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name graph-enrichment --stale-after 600 -- /usr/bin/env GRAPH_ENRICHMENT_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/graph_enrichment.py
  image: python3.13
  schedule: "55 * * * *"
  timeout: 300
  emails: onfailure

- name: catalog-projection
  # Repair/version-upgrade the Evolved-local provenance projection. Producer
  # jobs refresh changed tools immediately; this bounded sweep is the backstop.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-projection --stale-after 600 -- /usr/bin/env CATALOG_PROJECTION_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_projection.py
  image: python3.13
  schedule: "58 * * * *"
  timeout: 300
  emails: onfailure

- name: tool-assets
  # Fetch icons only in the background under outbound URL, type, and size
  # limits. The webservice serves cached bytes and never fetches on a read.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name tool-assets --stale-after 1200 -- /usr/bin/env TOOL_ASSET_LIMIT=100 TOOLHUB_ASSET_CACHE_DIR=/data/project/toolhub-evolved/data/icon-cache /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/tool_assets.py
  image: python3.13
  schedule: "7 * * * *"
  timeout: 600
  emails: onfailure

- name: catalog-validation
  # Probe effective public URLs under the shared SSRF/redirect guard. Results
  # are observations only; invalid official evidence remains preserved.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-validation --stale-after 1200 -- /usr/bin/env CATALOG_VALIDATION_LIMIT=200 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_validation.py
  image: python3.13
  schedule: "3 * * * *"
  timeout: 600
  emails: onfailure

- name: people-reconcile
  # Rebuild the deterministic people graph and typed relationships, reapply
  # durable approvals, and check a bounded set of unresolved labels for exact
  # Toolhub identity candidates. A dry run performs no external lookups.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-reconcile --stale-after 3600 -- /usr/bin/env /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --apply
  image: python3.13
  schedule: "13 5 * * 0"
  timeout: 1800
  emails: onfailure

- name: people-identity-reconcile
  # Resolve a bounded batch through Toolhub stable ids, CentralAuth, and
  # Toolforge SUL membership without repeating the full relationship rebuild.
  # Fresh unresolved candidates cool down for a day, so each run advances
  # through the population while transient failures are retried later.
  # PEOPLE_REGISTRY_LABEL_LIMIT resolves that many handle-shaped unresolved
  # labels against CentralAuth per run, four a second and serialized, walking a
  # cursor so every label gets a turn and unknown ones are retried once per
  # sweep. The fetcher sends maxlag and obeys Retry-After, so the service sets
  # the ceiling rather than a guessed delay. 1000 swept the 904-label backlog in
  # one 851s run, which left only 49s of the timeout; 500 is the steady-state
  # size now that only new labels arrive. It records identity only;
  # corroboration on a shared tool is what publishes anything.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-identity-reconcile --stale-after 1800 -- /usr/bin/env PEOPLE_IDENTITY_CANDIDATE_LIMIT=100 PEOPLE_REGISTRY_LABEL_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --identities-only
  image: python3.13
  schedule: "43 * * * *"
  timeout: 900
  emails: onfailure

- name: people-reconcile-incremental
  # Process canonical and newly ingested tool changes shortly after their
  # write transaction. The six-hour full pass remains the global backstop.
  # A kill at the timeout cannot release the guard lock, so every guarded job
  # sets --stale-after to twice its own timeout: past that, no live run can
  # still hold it. This drain died on 2026-08-03 that way and no run happened
  # for the next ten days.
  # The batch is sized to finish inside the timeout even from a cold backlog,
  # and small enough that its row locks do not sit across other identity
  # jobs: at 50 it held them for ~212s per run and deadlocked the source
  # audit and the maintainer backfill. Per-tool cost is unchanged, so
  # halving the batch halves the lock window at the same drain rate.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-reconcile-incremental --stale-after 600 -- /usr/bin/env PEOPLE_RECONCILE_QUEUE_LIMIT=25 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --queue
  image: python3.13
  schedule: "* * * * *"
  timeout: 300
  emails: onfailure

- name: api-cache-invalidator
  # Poll official Toolhub recent changes out of band, invalidate affected rows,
  # then prewarm hot anonymous reads so user requests never pay that cost.
  command: $HOME/repo/tools/job_guard.sh --job-name api-cache-invalidator -- $HOME/www/python/venv/bin/python $HOME/repo/proxy/cache_invalidation.py
  image: python3.13
  schedule: "* * * * *"
  emails: onfailure

- name: digest-publish
  # At 06:15 UTC, generate every missing closed, non-empty UTC period and
  # publish immutable daily/weekly/monthly editions plus the Meta archive.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name digest-publish --stale-after 3600 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/digest_publish.py
  image: python3.13
  schedule: "15 6 * * *"
  timeout: 1800
  emails: onfailure

- name: digest-deliver
  # Rebuild missing outbox rows and drain a bounded email/talk-page batch.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name digest-deliver --stale-after 600 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/digest_deliver.py
  image: python3.13
  schedule: "*/5 * * * *"
  timeout: 300
  emails: onfailure

- name: digest-audit
  # Turn durable publication failures and stale delivery backlogs into an
  # operator-visible failure email rather than trusting cron execution alone.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name digest-audit --stale-after 240 -- /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/digest_audit.py
  image: python3.13
  schedule: "23 * * * *"
  timeout: 120
  emails: onfailure

- name: db-backup
  # Nightly ToolsDB dump with 14-day rotation (tools/backup-db.sh).
  # The mariadb image ships the client tools; check `toolforge jobs images`
  # if the image name changes.
  command: sh $HOME/repo/tools/job_guard.sh --job-name db-backup -- sh $HOME/repo/tools/backup-db.sh
  image: mariadb
  schedule: "45 2 * * *"
  emails: onfailure

- name: rotate-logs
  # Copy-truncate rotation for ~/uwsgi.log and every per-job .out/.err
  # (tools/rotate-logs.sh). Runs after db-backup so the two never contend for
  # the same disk window. Rotation cannot rename: uwsgi and the jobs framework
  # hold these files open and would keep writing to the rotated inode.
  command: sh $HOME/repo/tools/job_guard.sh --job-name rotate-logs -- sh $HOME/repo/tools/rotate-logs.sh
  image: python3.13
  schedule: "5 3 * * *"
  emails: onfailure
