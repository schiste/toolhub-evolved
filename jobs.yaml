# Toolforge Jobs framework definitions (docs/RUNBOOK.md).
# Load/refresh with:  toolforge jobs load ~/repo/jobs.yaml
---
- name: crawler
  # Hourly toolinfo crawl: fetches every registered URL, validates records,
  # upserts locally-registered tools (skipping names that exist upstream).
  command: $HOME/repo/tools/job_guard.sh --job-name crawler -- $HOME/www/python/venv/bin/python $HOME/repo/proxy/crawl.py
  image: python3.13
  schedule: "17 * * * *"
  emails: onfailure

- name: toolinfo-discovery
  # Background discovery for official Toolhub tools: walk /api/tools/ pages,
  # check root /toolinfo.json first, then same-origin sitemap.xml entries.
  # Keep it off the request path, but scan a large enough window that the
  # official catalog converges quickly across repeated runs.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name toolinfo-discovery -- /usr/bin/env TOOLINFO_DISCOVERY_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/toolinfo_discovery.py
  image: python3.13
  schedule: "37 */6 * * *"
  emails: onfailure

- name: toolinfo-source-index
  # Background source index for official Toolhub crawler URLs: mirror
  # /api/crawler/urls/, fetch each registered feed, and map tool names back to
  # the feed Toolhub crawls. This is canonical provenance evidence; root/sitemap
  # discovery remains a secondary self-hosted metadata check.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name toolinfo-source-index -- /usr/bin/env TOOLINFO_SOURCE_INDEX_LIMIT=150 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/toolinfo_sources.py
  image: python3.13
  schedule: "11 */6 * * *"
  emails: onfailure

- name: catalog-sync
  # Initial backfill: five 100-record pages every 15 minutes. After the first
  # cycle, consume recent changes, hydrate up to twenty graph candidates, and
  # reconcile one page every 12 hours, with three seconds between requests.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-sync -- /usr/bin/env CATALOG_SYNC_PAGES=5 CATALOG_SYNC_PAGE_SIZE=100 CATALOG_SYNC_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_sync.py
  image: python3.13
  schedule: "*/15 * * * *"
  timeout: 300
  emails: onfailure

- name: maintainer-backfill
  # Backfill public Toolsadmin maintainer evidence for cached Toolforge tools.
  # One request is spaced at least three seconds from the previous request;
  # the cursor advances after every tool and retries failures next cycle.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name maintainer-backfill -- /usr/bin/env MAINTAINER_BACKFILL_LIMIT=60 MAINTAINER_BACKFILL_MIN_INTERVAL_SECONDS=3 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/maintainer_backfill.py
  image: python3.13
  schedule: "13 * * * *"
  timeout: 300
  emails: onfailure

- name: repository-analysis
  # Deterministically analyze up to 100 newly added or changed public repositories
  # per hour. The initial catalog backfill can be run manually with a larger limit.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name repository-analysis -- /usr/bin/env REPOSITORY_SCAN_LIMIT=100 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/repository_scan.py
  image: python3.13
  schedule: "47 * * * *"
  timeout: 900
  emails: onfailure

- name: graph-enrichment
  # Local-only repair and quality audit. Producer jobs materialize affected
  # tools immediately; this hourly sweep catches missed rows and rule-version
  # upgrades, then logs facet coverage and taxonomy regressions.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name graph-enrichment -- /usr/bin/env GRAPH_ENRICHMENT_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/graph_enrichment.py
  image: python3.13
  schedule: "55 * * * *"
  timeout: 300
  emails: onfailure

- name: catalog-projection
  # Repair/version-upgrade the Evolved-local provenance projection. Producer
  # jobs refresh changed tools immediately; this bounded sweep is the backstop.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-projection -- /usr/bin/env CATALOG_PROJECTION_LIMIT=500 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_projection.py
  image: python3.13
  schedule: "58 * * * *"
  timeout: 300
  emails: onfailure

- name: tool-assets
  # Fetch icons only in the background under outbound URL, type, and size
  # limits. The webservice serves cached bytes and never fetches on a read.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name tool-assets -- /usr/bin/env TOOL_ASSET_LIMIT=100 TOOLHUB_ASSET_CACHE_DIR=/data/project/toolhub-evolved/data/icon-cache /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/tool_assets.py
  image: python3.13
  schedule: "7 * * * *"
  timeout: 600
  emails: onfailure

- name: catalog-validation
  # Probe effective public URLs under the shared SSRF/redirect guard. Results
  # are observations only; invalid official evidence remains preserved.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name catalog-validation -- /usr/bin/env CATALOG_VALIDATION_LIMIT=200 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/catalog_validation.py
  image: python3.13
  schedule: "3 * * * *"
  timeout: 600
  emails: onfailure

- name: people-reconcile
  # Rebuild the deterministic people graph and typed relationships. The first
  # run can be inspected safely with `proxy/people_reconcile.py` without --apply.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-reconcile -- /usr/bin/env /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --apply
  image: python3.13
  schedule: "23 */6 * * *"
  timeout: 600
  emails: onfailure

- name: people-reconcile-incremental
  # Process canonical and newly ingested tool changes shortly after their
  # write transaction. The six-hour full pass remains the global backstop.
  command: /data/project/toolhub-evolved/repo/tools/job_guard.sh --job-name people-reconcile-incremental -- /usr/bin/env PEOPLE_RECONCILE_QUEUE_LIMIT=100 /data/project/toolhub-evolved/www/python/venv/bin/python /data/project/toolhub-evolved/repo/proxy/people_reconcile.py --queue
  image: python3.13
  schedule: "* * * * *"
  timeout: 120
  emails: onfailure

- name: api-cache-invalidator
  # Poll official Toolhub recent changes out of band, invalidate affected rows,
  # then prewarm hot anonymous reads so user requests never pay that cost.
  command: $HOME/repo/tools/job_guard.sh --job-name api-cache-invalidator -- $HOME/www/python/venv/bin/python $HOME/repo/proxy/cache_invalidation.py
  image: python3.13
  schedule: "* * * * *"
  emails: onfailure

- name: db-backup
  # Nightly ToolsDB dump with 14-day rotation (tools/backup-db.sh).
  # The mariadb image ships the client tools; check `toolforge jobs images`
  # if the image name changes.
  command: sh $HOME/repo/tools/job_guard.sh --job-name db-backup -- sh $HOME/repo/tools/backup-db.sh
  image: mariadb
  schedule: "45 2 * * *"
  emails: onfailure
