[tool.ruff]
target-version = "py311"
line-length = 120
src = ["proxy"]

[tool.ruff.lint]
# "ALL" includes flake8-bandit (the S* rules) — that IS our Python security
# scan (shell injection, eval, hardcoded secrets, requests without timeout, …).
# If you ever narrow this select list, keep "S" so security coverage stays on.
select = ["ALL"]
# Only non-security rules may be ignored. Never add an "S*" code here; silence a
# specific finding with an inline `# noqa: S### <reason>` so it stays auditable.
# D203/D211 and D212/D213 are mutually exclusive pairs in ruff's "ALL" set —
# pick one of each (D211, D212) to silence the "incompatible rules" warnings.
ignore = [
  "COM812",
  "D100",
  "D103",
  "D203",
  "D213",
  "ISC001"
]

# This repo deliberately uses bare SPDX license tags, not per-file copyright
# notices (see LICENSE for the license text). Point CPY001 at that convention
# so it enforces the header every file actually carries.
[tool.ruff.lint.flake8-copyright]
notice-rgx = 'SPDX-License-Identifier: GPL-3\.0-or-later'

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = ["app", "backend", "crawl"]
branch = true

[tool.coverage.report]
# The reverse proxy is small and security-sensitive, and it IS still held at
# 100%: `npm run coverage:proxy` (and the CI step of the same name) reports
# app.py and crawl.py alone with --fail-under=100.
#
# This number covers the whole measured tree, which is a different thing. It
# started life as a ratchet well below 100 while the /v1 backend caught up;
# since 2026-08 the whole tree (statements AND branches) is held at a literal
# 100%, so the app.py/crawl.py step above is now a belt-and-suspenders check
# rather than a stricter bar.
#
# This is a RATCHET: it may never be lowered. New code lands with the tests
# that cover it, in the same commit. The handful of genuinely unreachable
# defensive branches are exercised directly (see the *_gaps / helper-level
# tests) or carry an explicit `# pragma: no cover`.
fail_under = 100
precision = 2
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

