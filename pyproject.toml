[tool.ruff]
target-version = "py311"
line-length = 120
src = ["proxy"]

[tool.ruff.lint]
# "ALL" includes flake8-bandit (the S* rules) — that IS our Python security
# scan (shell injection, eval, hardcoded secrets, requests without timeout, …).
# If you ever narrow this select list, keep "S" so security coverage stays on.
select = ["ALL"]
# Only non-security rules may be ignored. Never add an "S*" code here; silence a
# specific finding with an inline `# noqa: S### <reason>` so it stays auditable.
# D203/D211 and D212/D213 are mutually exclusive pairs in ruff's "ALL" set —
# pick one of each (D211, D212) to silence the "incompatible rules" warnings.
ignore = [
  "COM812",
  "D100",
  "D103",
  "D203",
  "D213",
  "ISC001"
]

[tool.ruff.format]
line-ending = "lf"

[tool.coverage.run]
source = ["app", "backend", "crawl"]
branch = true

[tool.coverage.report]
# The proxy is small and security-sensitive; require full coverage so every
# branch of the reverse proxy and the static-file traversal guard is exercised.
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff.lint.per-file-ignores]
# The v1_* modules are one route module split by size, not independent
# components: backend/v1.py held 83 of the app's 87 routes across 23 unrelated
# resource families, so unrelated changes all landed in the same file. The
# split families still reach v1.py's helpers, which SLF001 reads as poking at
# another object's privates. It is not wrong to flag it — those 25 helpers
# (134 cross-module call sites) are now package API and belong in a common
# module with public names. Renaming them touches 303 more references inside
# v1.py, so it is its own change; this exemption is scoped to the split
# modules so the rule keeps working everywhere else.
"proxy/backend/v1_*.py" = ["SLF001"]
