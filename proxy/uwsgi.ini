# Extra uWSGI settings for the Toolforge python webservice.
# tools/deploy.sh installs this at ~/www/python/uwsgi.ini, where the webservice
# picks it up; keeping it in the repo means the setting is reviewed and
# reproducible rather than hand-placed on the server.
[uwsgi]
# Toolforge starts four workers, so the webservice could only ever serve four
# requests at once. The SPA is unbundled ES modules: a cold page load asks for
# 33 of them in one burst, which queued eight deep and showed up as ~400ms of
# median wait per module against a 1.8ms server time.
#
# An earlier version of this comment said those workers get "one core each".
# They do not. The pod's limit is 500m — half a core in total, shared by every
# worker and thread — and it was measured spending 66% of its CPU scheduling
# periods throttled (26.5s throttled against 18.6s actually running). Threads
# cannot buy throughput that the quota does not have; they only help while a
# handler is blocked rather than computing. That is why the compression those
# 33 requests used to pay for now happens once at build time
# (tools/build_dist.py) instead of once per request: the fix for a CPU cap is
# to need less CPU, not to add concurrency in front of it.
#
# Threads rather than more workers: serving a static file is almost entirely
# file I/O and zlib, both of which release the GIL, and threads share the
# worker's memory where extra processes would each pay for their own — this pod
# has a memory cap. Shared state is already guarded (backend/security.py's
# RollingLimit takes a lock, database work is per-request via session_scope),
# and backend/db.py bounds each worker's connection pool so the added
# concurrency cannot exceed ToolsDB's per-account connection limit.
threads = 4
# Threads only take effect when uWSGI is built/started with threading enabled.
enable-threads = true
