# Reviewed from the `aethyme init` draft.
# Rules: commands run with cwd = the worktree under test (bare —
# no venv/node_modules); gate outputs must be gitignored.

# js-lint (drafted as `npm run lint`) was removed: it resolves to
# `eslint . --max-warnings 0`, a node_modules/.bin binary that does not
# exist in a bare worktree. JS/CSS linting stays with .githooks/pre-commit
# -> lint-staged, which runs in the main checkout where deps are installed.

# The draft guessed `python3 -m ruff check .`. Three corrections, each of
# which independently made the gate wrong:
#   scope   — pyproject sets select = ["ALL"], which only proxy/ is held to.
#             Repo-wide `.` reports 5817 errors; CI runs `ruff check proxy`.
#   version — CI pins ruff==0.16.3 (tools/python-quality-requirements.txt).
#             The PATH ruff here is 0.15.21, which fires FURB171 on
#             proxy/backend/source_analyzer.py:679 while 0.14.9 passes.
#             An unpinned gate blocks commits for findings CI never reports.
#   binary  — `python3 -m ruff` resolves to a different version per
#             environment (0.6.9 / 0.14.9 / 0.15.21 all seen on this machine).
# uvx pins the version, needs no venv (works in a bare worktree), and runs
# in ~28ms once the version is cached.
# Mirrors .github/workflows/ci.yml lines 81 and 83.

[[gate]]
name = "ruff-check"
command = "uvx ruff@0.16.3 check proxy"
cost = 1
triggers = ["proxy/**/*.py", "pyproject.toml"]

[[gate]]
name = "ruff-format"
command = "uvx ruff@0.16.3 format --check proxy"
cost = 1
triggers = ["proxy/**/*.py", "pyproject.toml"]

# The gates above only ever ran ruff, so a backend change reached integration
# with no test having run: session 72's frontend-only diff matched no trigger at
# all and reported "gate wall time: 0ms", which is indistinguishable in the
# submit output from a clean pass.
# The `no node_modules in a bare worktree` argument that removed js-lint does not
# apply here: uv resolves the requirements into its own cache, so this needs no
# venv and no `pip install` in the worktree. First run pays the download; after
# that the suite is the whole cost (~50s for 1663 tests).
# cost = 3 keeps it out of .githooks/pre-commit, which runs only cost <= 1, so it
# gates submissions without adding a minute to every commit.
# tests/proxy/**/*.py is in the triggers and NOT in the ruff gates above on
# purpose: `ruff check proxy` does not read those files (CI lints proxy only), so
# widening ruff there would run a check that cannot see what changed. pytest can.
# Mirrors .github/workflows/ci.yml line 95, minus the coverage ratchet.

[[gate]]
name = "pytest-proxy"
command = "uv run --no-project --with-requirements proxy/requirements.txt --with pytest --python 3.11 env PYTHONPATH=proxy pytest tests/proxy -q"
cost = 3
triggers = ["proxy/**/*.py", "tests/proxy/**/*.py", "proxy/requirements.txt", "pyproject.toml"]
