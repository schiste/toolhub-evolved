# gitleaks config — secret scanning for toolhub-evolved.
# Extends the upstream default ruleset (the standard, maintained set of
# credential/private-key/token detectors) and only adds path allowlists for
# generated or vendored trees that are not first-party source.
title = "toolhub-evolved"

[extend]
useDefault = true

[allowlist]
description = "Generated, vendored, or report output — not first-party source."
paths = [
    '''node_modules/''',
    '''package-lock\.json''',
    '''playwright-report/''',
    '''reports/''',
    '''dist/''',
    '''\.git/''',
    # Generated by `aethyme enhance deploy`. Their "Snapshot key" is a content
    # hash of the repository, regenerated on every deploy, and reads to the
    # generic-api-key rule as a 40-character credential.
    '''\.claude/skills/repo-onboarding/SKILL\.md''',
    '''\.codex/skills/repo-onboarding/SKILL\.md'''
]
# The source analyzer's job is to find secrets committed in the tools it scans,
# so its fixtures have to contain things that look like secrets. These are the
# placeholder vendor keys those fixtures use -- allowlisted by value rather than
# by path, so a real credential in the same files would still be caught.
regexes = [
    '''sk-live-[0-9a-f]{16}'''
]
