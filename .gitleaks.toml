# gitleaks config — secret scanning for toolhub-evolved.
# Extends the upstream default ruleset (the standard, maintained set of
# credential/private-key/token detectors) and only adds path allowlists for
# generated or vendored trees that are not first-party source.
title = "toolhub-evolved"

[extend]
useDefault = true

[[allowlists]]
description = "Generated, vendored, or report output — not first-party source."
paths = [
    '''node_modules/''',
    '''package-lock\.json''',
    '''playwright-report/''',
    '''reports/''',
    '''dist/''',
    '''__pycache__/''',
    '''\.git/''',
    # Generated by `aethyme enhance deploy`. Their "Snapshot key" is a content
    # hash of the repository, regenerated on every deploy, and reads to the
    # generic-api-key rule as a 40-character credential.
    '''\.claude/skills/repo-onboarding/SKILL\.md''',
    '''\.codex/skills/repo-onboarding/SKILL\.md'''
]

# The source analyzer's job is to find secrets committed in the tools it scans,
# so its fixtures have to contain things that look like secrets. `condition =
# "AND"` is what makes this narrow: gitleaks ORs allowlist criteria by default,
# so listing the value alone would have exempted every `sk-live-` key anywhere
# in the repository, production configuration included. Requiring the path too
# means the placeholder is ignored only where the fixtures live, and a real
# credential of any other shape in those same files is still caught.
[[allowlists]]
description = "Placeholder vendor keys in the source-analyzer fixtures."
condition = "AND"
paths = [
    '''tests/proxy/test_source_analyzer\.py''',
    '''tests/proxy/test_source_endpoints\.py'''
]
regexes = [
    '''sk-live-[0-9a-f]{16}'''
]
