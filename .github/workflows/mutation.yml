# Mutation testing (Stryker) over the whole app, at a literal 100% score.
# A single full-scope run is ~70 min (7k+ mutants) and exceeds the runner's
# per-job ceiling, so it is SHARDED into a matrix of short per-area jobs (each a
# few thousand mutants, well under the limit) that together cover public_html/**.
# Runs weekly (Monday 04:37 UTC) and on demand; per-push CI relies on the unit
# suite + coverage gate. Weekly rather than nightly because one full matrix costs
# ~154 runner-minutes (measured, run 32334403679) and the score only moves when
# someone deliberately writes tests - a nightly cadence just re-measured the same
# number every morning. Monday so the result is waiting at the start of the week.
name: Mutation

on:
    schedule:
        - cron: "37 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    stryker:
        name: Stryker (${{ matrix.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Three shards used to freeze mid-run and then be killed by the runner
                    # at a fixed mutant count: core at 1452, organisms-rest at 702,
                    # atoms+molecules at 1751. The cause was finally pinned down by
                    # reproducing organisms-rest inside a memory-capped container: a few
                    # mutants delete the termination condition of a self-re-triggering DOM
                    # event handler. icon-fallbacks.js is the worst offender — its `error`
                    # listener reacts to a failed image load by setting `src`, which fails
                    # and fires `error` again. 16 of its 80 mutants knock out one of the
                    # four brakes, and the handler then recurses without bound, allocating
                    # a <template> plus a parsed HTML string per turn: ~15 GB in ~15 s, far
                    # faster than Stryker's 5 s wall-clock timeout can react. account.js,
                    # command-palette.js and langpicker.js have their own.
                    # The fixed counts are simply where a runaway mutant sits in a stable
                    # ordering. Whether the *job* died was a kernel OOM race between the
                    # vitest child (Stryker restarts it, and the mutant is recorded as a
                    # RuntimeError) and the runner agent (fatal).
                    # Four theories were falsified; recorded so they are not retried: static
                    # mutants (`--ignoreStatic` moved core's set across 5688/5509/5515 and
                    # organisms-rest's across 4518/4335, and both still died at the same
                    # counts), per-run worker accumulation, Stryker-parent accumulation (thread
                    # count is flat at 19 and children hold 15.2 of 15.8 GB), and concurrency
                    # (two concurrency-1 replicates died at 702 and 703 with a single child
                    # peaking near 15 GB).
                    # A first cap attempt (run 32291137195) also failed and is worth knowing
                    # about: `-p MemoryMax=6G` with no OOM policy made things strictly worse,
                    # six of nine shards exiting 143 (SIGTERM), because systemd's default
                    # policy stops the whole scope rather than letting the kernel SIGKILL just
                    # the offending child. Probe run 32341225519 measured all four settings on
                    # systemd 255: unset and `stop` take the parent down with it (143), `kill`
                    # does too (137), and only `continue` does what is wanted - child SIGKILLed
                    # at 137, parent alive, scope exit 0. Hence the policy on the step below.
                    # 6 GB was also simply too tight: organisms-qv and organisms-graph were
                    # dying there while doing honest work.
                    # Because `break: 100` already makes every job red, these deaths were
                    # indistinguishable from a below-threshold score, and the affected
                    # shards had quietly stopped being measured at all.
                    - name: core
                      scope: "public_html/lib/core/**/*.js"
                    - name: atoms+molecules
                      scope: "public_html/lib/atoms/**/*.js,public_html/lib/molecules/**/*.js"
                    # force-graph is isolated: its rAF/canvas physics loop yields
                    # infinite-loop mutants (e.g. a counting-up `for` flipped to count
                    # down) that peg a core until Stryker's timeout. Bundled with the
                    # rest of organisms on a 2-vCPU runner, several at once starve the
                    # runner agent's heartbeat → "runner lost communication" (an OOM/CPU
                    # infra failure, not a survivor). Its own shard + concurrency 1 keeps
                    # one core free for the agent so these mutants are killed, not lost.
                    - name: organisms-graph
                      scope: "public_html/lib/organisms/force-graph.js"
                      concurrency: "1"
                    # quickview's modal/focus-trap mutants make the code read happy-dom's
                    # real offsetParent getter, which hangs until Stryker's timeout. A
                    # single worker grinding through all of quickview's ~33 such hangs
                    # accumulates happy-dom heap until the 2-vCPU runner OOMs (the job is
                    # cancelled mid-run). Isolated, it is small enough to finish first;
                    # organisms-graph (227 mutants, single-worker) proves that bound.
                    - name: organisms-qv
                      scope: "public_html/lib/organisms/quickview.js"
                      concurrency: "1"
                    # Everything else in organisms is light, fast HTML/DOM assertion work
                    # (no hang cluster) — runs at the default concurrency.
                    - name: organisms-rest
                      scope: "public_html/lib/organisms/**/*.js,!public_html/lib/organisms/force-graph.js,!public_html/lib/organisms/quickview.js"
                    - name: views-a
                      scope: "public_html/views/home.js,public_html/views/search.js,public_html/views/tool.js"
                    - name: views-b
                      scope: "public_html/views/lists.js,public_html/views/toolforms.js"
                    - name: styleguide
                      scope: "public_html/views/styleguide.js"
                    - name: views-rest+main
                      scope: "public_html/views/router.js,public_html/views/static.js,public_html/views/graph.js,public_html/views/authors.js,public_html/views/experiments.js,public_html/views/_fixtures.js,public_html/main.js"
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Stryker (vitest runner, happy-dom — no browser needed)
              env:
                  SCOPE: ${{ matrix.scope }}
                  # Default 2 keeps a core's worth of headroom on the 2-vCPU runner so
                  # infinite-loop mutants are killed by Stryker's timeout, never by
                  # starving the runner agent. Heavy shards may pin it lower (matrix).
                  CONCURRENCY: ${{ matrix.concurrency || '2' }}
                  # On by default for every shard; a shard may override it in the
                  # matrix. `${VAR:+...}` still drops the flag if ever set empty.
                  RUNNER_REUSE: ${{ matrix.maxTestRunnerReuse || '100' }}
              # Runaway mutants (see the matrix comment) allocate ~15 GB in ~15 s, far
              # faster than Stryker's 5 s timeout can react, and uncapped the kernel may
              # pick the runner agent as its victim, which kills the whole job. The cgroup
              # below bounds them. `OOMPolicy=continue` is what makes it work: without it
              # systemd stops the entire scope, taking Stryker down too (measured, run
              # 32341225519). 12 GB on a ~16 GB runner sits above what a legitimate shard
              # needs while still leaving the agent room - 6 GB was under it. Stryker
              # restarts the killed child and records the mutant as a RuntimeError.
              run: |
                  # `bash -e` is GitHub's default and Stryker always exits non-zero
                  # while `break: 100` stands, so errexit off is what lets the summary
                  # below run at all; pipefail keeps rc as Stryker's, not tee's.
                  set +e -o pipefail
                  set -- --mutate "$SCOPE" --concurrency "$CONCURRENCY" ${RUNNER_REUSE:+--maxTestRunnerReuse $RUNNER_REUSE}
                  if sudo -n systemd-run --version >/dev/null 2>&1; then
                      sudo -n systemd-run --scope --quiet --collect \
                          -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue \
                          ./node_modules/.bin/stryker run "$@" 2>&1 | tee /tmp/stryker.log
                  else
                      echo "::warning::systemd-run unavailable - Stryker is running without a memory cap"
                      ./node_modules/.bin/stryker run "$@" 2>&1 | tee /tmp/stryker.log
                  fi
                  rc=$?

                  # RuntimeErrors are excluded from Stryker's score denominator, so a cap
                  # that is merely too tight no longer kills the job - it quietly turns
                  # honest mutants into errors and INFLATES the score. Surface the count
                  # so that cannot happen unnoticed.
                  awk -F'|' '/^All files/ {
                      for (i = 1; i <= NF; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i)
                      denom = $4 + $5 + $6 + $7
                      printf "::notice::score %s%% - killed %s, timeout %s, survived %s, no-cov %s, errors %s\n", $2, $4, $5, $6, $7, $8
                      if (denom > 0 && $8 / (denom + $8) > 0.01)
                          printf "::warning::%s mutants were RuntimeErrors (>1%% of the set) and left the denominator, so the %s%% score is inflated - check the memory cap\n", $8, $2
                  }' /tmp/stryker.log
                  exit "$rc"
