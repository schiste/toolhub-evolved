# Mutation testing (Stryker) over the whole app.
# A single full-scope run is ~70 min (7k+ mutants) and exceeds the runner's
# per-job ceiling, so it is SHARDED into a matrix of short per-area jobs (each a
# few thousand mutants, well under the limit) that together cover public_html/**.
# Runs weekly (Monday 04:37 UTC) and on demand; per-push CI relies on the unit
# suite + coverage gate. Weekly rather than nightly because one full matrix costs
# ~154 runner-minutes (measured, run 32334403679) and the score only moves when
# someone deliberately writes tests - a nightly cadence just re-measured the same
# number every morning. Monday so the result is waiting at the start of the week.
name: Mutation

on:
    schedule:
        - cron: "37 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    cancel-in-progress: true

jobs:
    stryker:
        name: Stryker (${{ matrix.name }})
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Three shards used to freeze mid-run and then be killed by the runner
                    # at a fixed mutant count: core at 1452, organisms-rest at 702,
                    # atoms+molecules at 1751. The cause was finally pinned down by
                    # reproducing organisms-rest inside a memory-capped container: a few
                    # mutants delete the termination condition of a self-re-triggering DOM
                    # event handler. icon-fallbacks.js is the worst offender — its `error`
                    # listener reacts to a failed image load by setting `src`, which fails
                    # and fires `error` again. 16 of its 80 mutants knock out one of the
                    # four brakes, and the handler then recurses without bound, allocating
                    # a <template> plus a parsed HTML string per turn: ~15 GB in ~15 s, far
                    # faster than Stryker's 5 s wall-clock timeout can react. account.js,
                    # command-palette.js and langpicker.js have their own.
                    # The fixed counts are simply where a runaway mutant sits in a stable
                    # ordering. Whether the *job* died was a kernel OOM race between the
                    # vitest child (Stryker restarts it, and the mutant is recorded as a
                    # RuntimeError) and the runner agent (fatal).
                    # Four theories were falsified; recorded so they are not retried: static
                    # mutants (`--ignoreStatic` moved core's set across 5688/5509/5515 and
                    # organisms-rest's across 4518/4335, and both still died at the same
                    # counts), per-run worker accumulation, Stryker-parent accumulation (thread
                    # count is flat at 19 and children hold 15.2 of 15.8 GB), and concurrency
                    # (two concurrency-1 replicates died at 702 and 703 with a single child
                    # peaking near 15 GB).
                    # A first cap attempt (run 32291137195) also failed and is worth knowing
                    # about: `-p MemoryMax=6G` with no OOM policy made things strictly worse,
                    # six of nine shards exiting 143 (SIGTERM), because systemd's default
                    # policy stops the whole scope rather than letting the kernel SIGKILL just
                    # the offending child. Probe run 32341225519 measured all four settings on
                    # systemd 255: unset and `stop` take the parent down with it (143), `kill`
                    # does too (137), and only `continue` does what is wanted - child SIGKILLed
                    # at 137, parent alive, scope exit 0. Hence the policy on the step below.
                    # 6 GB was also simply too tight: organisms-qv and organisms-graph were
                    # dying there while doing honest work.
                    # Because the unreachable `break: 100` of the time already made every
                    # job red, these deaths were indistinguishable from a below-threshold
                    # score, and the affected shards had quietly stopped being measured at
                    # all. The per-shard floors below are what tells the two apart now.
                    # Every shard carries a `floor`: the score it may not drop below.
                    # There is no global one, because `break` in stryker.conf.json is a
                    # single number for an app whose shards range from 22% to 100%, and
                    # the 100 it held for months failed all of them, every week, until a
                    # red Mutation run meant nothing at all. Each floor here is what its
                    # shard actually measured on CI (run 32862303176), rounded down, so
                    # today's matrix goes green and tomorrow's regression does not. A
                    # floor of "0" means nothing is being guarded yet -- read the first
                    # green run's ::notice:: line and raise it. Floors only ever go up.
                    #
                    # Re-seed them from a run of the tree they will guard, not from an
                    # older one. A score is a ratio, and the denominator grows every time
                    # a session lands code the tests have not caught up with yet, so a
                    # floor carried across a few merges fails on dilution and reads
                    # exactly like a regression -- which is the fault this whole file is
                    # here to stop making. The first attempt did it anyway: floors read
                    # from run 32693322476 put views-a and atoms+molecules a fraction of
                    # a point under, on 114 lines of other people's honest work.
                    # core was one shard of 5741 lines and it has never once finished:
                    # every run on record is killed at exactly 60 min by the job
                    # ceiling above, so it reports no score at all and no floor could
                    # apply to it. Split four ways along the same carve-out idiom as
                    # organisms-*: the heavy files get their own shards and core-rest
                    # keeps the wildcard, so a new file under lib/core is mutated by
                    # something the day it is added rather than waiting to be noticed.
                    - name: core-api
                      scope: "public_html/lib/core/api.js"
                      floor: "67"
                    - name: core-state
                      scope: "public_html/lib/core/store.js,public_html/lib/core/signals.js"
                      floor: "67"
                    - name: core-transform
                      scope: "public_html/lib/core/i18n.js,public_html/lib/core/graph.js,public_html/lib/core/toolinfo-generator.js,public_html/lib/core/markdown.js,public_html/lib/core/similarity.js"
                      floor: "0"
                    - name: core-rest
                      scope: "public_html/lib/core/**/*.js,!public_html/lib/core/api.js,!public_html/lib/core/store.js,!public_html/lib/core/signals.js,!public_html/lib/core/i18n.js,!public_html/lib/core/graph.js,!public_html/lib/core/toolinfo-generator.js,!public_html/lib/core/markdown.js,!public_html/lib/core/similarity.js"
                      floor: "0"
                    - name: atoms+molecules
                      scope: "public_html/lib/atoms/**/*.js,public_html/lib/molecules/**/*.js"
                      floor: "66"
                    # force-graph is isolated: its rAF/canvas physics loop yields
                    # infinite-loop mutants (e.g. a counting-up `for` flipped to count
                    # down) that peg a core until Stryker's timeout. Bundled with the
                    # rest of organisms on a 2-vCPU runner, several at once starve the
                    # runner agent's heartbeat → "runner lost communication" (an OOM/CPU
                    # infra failure, not a survivor). Its own shard + concurrency 1 keeps
                    # one core free for the agent so these mutants are killed, not lost.
                    - name: organisms-graph
                      scope: "public_html/lib/organisms/force-graph.js"
                      floor: "53"
                      concurrency: "1"
                    # quickview's modal/focus-trap mutants make the code read happy-dom's
                    # real offsetParent getter, which hangs until Stryker's timeout. A
                    # single worker grinding through all of quickview's ~33 such hangs
                    # accumulates happy-dom heap until the 2-vCPU runner OOMs (the job is
                    # cancelled mid-run). Isolated, it is small enough to finish first;
                    # organisms-graph (227 mutants, single-worker) proves that bound.
                    - name: organisms-qv
                      # Reports 100%, but a quarter of its mutants never reach the
                      # denominator: RuntimeErrors are excluded from it, and this shard
                      # produced 24 of them one run and 34 the next. The floor is what it
                      # would score if every one of those came back a survivor -- 107 of
                      # 141, taking the worse count -- because a memory cap that stops
                      # mangling this shard must not read as a test regression. So this
                      # one is a worst-case bound rather than a measurement, and the count
                      # it is derived from moves: re-derive it from the errors column,
                      # never raise it toward the 100 the shard appears to report.
                      scope: "public_html/lib/organisms/quickview.js"
                      floor: "75"
                      concurrency: "1"
                    # Everything else in organisms is light, fast HTML/DOM assertion work
                    # (no hang cluster) — runs at the default concurrency.
                    - name: organisms-rest
                      scope: "public_html/lib/organisms/**/*.js,!public_html/lib/organisms/force-graph.js,!public_html/lib/organisms/quickview.js"
                      floor: "42"
                    - name: views-a
                      scope: "public_html/views/home.js,public_html/views/search.js,public_html/views/tool.js"
                      floor: "68"
                    - name: views-b
                      scope: "public_html/views/lists.js,public_html/views/toolforms.js"
                      floor: "70"
                    - name: styleguide
                      scope: "public_html/views/styleguide.js"
                      floor: "22"
                    - name: views-rest+main
                      # Back to 0: the 46 here was measured on a tree this shard has since
                      # left behind, and the run that would have replaced it aborted its
                      # dry run instead. Nothing has scored these files since, so there is
                      # nothing honest to guard with. Read the first green run and raise it.
                      scope: "public_html/views/router.js,public_html/views/static.js,public_html/views/graph.js,public_html/views/authors.js,public_html/views/experiments.js,public_html/views/_fixtures.js,public_html/main.js"
                      floor: "0"
                    # The three shards below were added to close a coverage gap, not to
                    # split a slow job: eighteen files matched stryker.conf's `mutate`
                    # glob and appeared in no scope above, so nothing ever mutated them
                    # while the config described the app as fully covered. They are
                    # grouped by area and balanced at roughly 1.3k lines each.
                    # tests/unit/mutation-shards.test.mjs now fails if a file drifts
                    # back out of every scope.
                    - name: views-account
                      scope: "public_html/views/account-settings.js,public_html/views/accounts.js,public_html/views/developer-settings.js,public_html/views/my-tools.js"
                      floor: "42"
                    - name: views-catalog
                      scope: "public_html/views/recent.js,public_html/views/statistics.js,public_html/views/userscripts.js"
                      floor: "58"
                    - name: views-ops
                      scope: "public_html/views/workers.js,public_html/views/crawler.js,public_html/views/mcp-server.js,public_html/views/digests.js,public_html/views/changelog.js,public_html/views/audit.js,public_html/views/static-routes.js,public_html/views/members.js,public_html/views/community.js,public_html/i18n/locales.js,public_html/lib/workers/graph-layout-worker.js"
                      floor: "42"
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Stryker (vitest runner, happy-dom — no browser needed)
              env:
                  SCOPE: ${{ matrix.scope }}
                  # Default 2 keeps a core's worth of headroom on the 2-vCPU runner so
                  # infinite-loop mutants are killed by Stryker's timeout, never by
                  # starving the runner agent. Heavy shards may pin it lower (matrix).
                  CONCURRENCY: ${{ matrix.concurrency || '2' }}
                  # On by default for every shard; a shard may override it in the
                  # matrix. `${VAR:+...}` still drops the flag if ever set empty.
                  RUNNER_REUSE: ${{ matrix.maxTestRunnerReuse || '100' }}
                  # The lowest score this shard may report, as a ratchet: seeded
                  # from what the shard measured when the floor was introduced,
                  # rounded down. It only ever moves up, by hand, when someone
                  # writes tests. See the enforcement at the end of the run.
                  FLOOR: ${{ matrix.floor }}
              # Runaway mutants (see the matrix comment) allocate ~15 GB in ~15 s, far
              # faster than Stryker's 5 s timeout can react, and uncapped the kernel may
              # pick the runner agent as its victim, which kills the whole job. The cgroup
              # below bounds them. `OOMPolicy=continue` is what makes it work: without it
              # systemd stops the entire scope, taking Stryker down too (measured, run
              # 32341225519). 12 GB on a ~16 GB runner sits above what a legitimate shard
              # needs while still leaving the agent room - 6 GB was under it. Stryker
              # restarts the killed child and records the mutant as a RuntimeError.
              run: |
                  # `bash -e` is GitHub's default, and a shard that scores under its
                  # floor has to reach the summary below to say so rather than dying
                  # at the pipe; pipefail keeps rc as Stryker's, not tee's.
                  set +e -o pipefail
                  set -- --mutate "$SCOPE" --concurrency "$CONCURRENCY" ${RUNNER_REUSE:+--maxTestRunnerReuse $RUNNER_REUSE}
                  if sudo -n systemd-run --version >/dev/null 2>&1; then
                      sudo -n systemd-run --scope --quiet --collect \
                          -p MemoryMax=12G -p MemorySwapMax=0 -p OOMPolicy=continue \
                          ./node_modules/.bin/stryker run "$@" 2>&1 | tee /tmp/stryker.log
                  else
                      echo "::warning::systemd-run unavailable - Stryker is running without a memory cap"
                      ./node_modules/.bin/stryker run "$@" 2>&1 | tee /tmp/stryker.log
                  fi
                  rc=$?

                  # RuntimeErrors are excluded from Stryker's score denominator, so a cap
                  # that is merely too tight no longer kills the job - it quietly turns
                  # honest mutants into errors and INFLATES the score. Surface the count
                  # so that cannot happen unnoticed.
                  awk -F'|' '/^All files/ {
                      for (i = 1; i <= NF; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i)
                      denom = $4 + $5 + $6 + $7
                      printf "::notice::score %s%% - killed %s, timeout %s, survived %s, no-cov %s, errors %s\n", $2, $4, $5, $6, $7, $8
                      if (denom > 0 && $8 / (denom + $8) > 0.01)
                          printf "::warning::%s mutants were RuntimeErrors (>1%% of the set) and left the denominator, so the %s%% score is inflated - check the memory cap\n", $8, $2
                  }' /tmp/stryker.log

                  # A crash is a crash: report it before judging a score that may not
                  # exist. Only past that does the floor apply.
                  if [ "$rc" -ne 0 ]; then
                      # Every abort arrives as the same non-zero rc -- a failed dry run, an
                      # OOM, the 60-minute ceiling -- and the run page shows "exit code 1"
                      # for all three, though they need different people and different
                      # fixes. Split them here, in an annotation, because annotations are
                      # readable while the run is still going and the log is not.
                      # The dry-run case is the one worth naming: Stryker stops before
                      # generating a single mutant, so one stale assertion silently costs
                      # the whole shard, and nothing on the run page says which test it was.
                      failed=$(awk '/tests failed in the initial test run/ { hit = 1; next }
                                    hit && /^\t[^\t]/ {
                                        gsub(/^\t|\r|\033\[[0-9;]*m/, "")
                                        list = list sep $0; sep = "; "
                                    }
                                    hit && /^[^\t]/ { exit }
                                    END { print list }' /tmp/stryker.log)
                      if [ -n "$failed" ]; then
                          echo "::error::${{ matrix.name }} aborted its dry run, so none of its files were mutated - these tests failed before any mutant was generated: $failed"
                      else
                          echo "::error::${{ matrix.name }} exited $rc without failing a test - not a dry-run abort, so check the memory cap and the job time limit"
                      fi
                      exit "$rc"
                  fi
                  score=$(awk -F'|' '/^All files/ { gsub(/ /, "", $2); print $2 }' /tmp/stryker.log)
                  # An empty score means the report never printed its summary line, which
                  # is a broken run wearing a green exit code - the one shape a floor
                  # comparison would silently pass.
                  if [ -z "$score" ]; then
                      echo "::error::Stryker exited 0 but printed no score line - the run did not complete"
                      exit 1
                  fi
                  # awk, not `[ ]`, because both sides are decimals.
                  if ! awk -v s="$score" -v f="$FLOOR" 'BEGIN { exit !(s + 0 >= f + 0) }'; then
                      echo "::error::${{ matrix.name }} scored $score%, below its floor of $FLOOR% - a test that used to kill a mutant no longer does"
                      exit 1
                  fi
                  echo "::notice::${{ matrix.name }} scored $score%, at or above its floor of $FLOOR%"
