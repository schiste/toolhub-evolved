# SPDX-License-Identifier: GPL-3.0-or-later
# Project CI: runs the quality suite on every push to main and every PR, so the
# gates protect the repository (not just whoever installed the local hook).
name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    aethyme-policy:
        name: Aethyme deployment
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install Aethyme binary pair
              run: brew install schiste/tap/aethyme
            - name: Verify paired binaries
              run: |
                  aethyme --version
                  aethyme-engine-cli --version
            - name: Verify repository policy
              run: aethyme deploy verify --repo .

    js:
        name: JS quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Prettier
              run: npx prettier --check .
            - name: ESLint
              run: npx eslint . --max-warnings 0
            - name: Stylelint
              run: npx stylelint "public_html/styles/**/*.css"
            - name: Spell-check (cspell)
              run: npm run spell
            - name: Types (tsc --checkJs)
              run: npx tsc -p jsconfig.json
            - name: Dead code (knip)
              run: npx knip --production
            - name: Duplication (jscpd)
              run: npx jscpd --config .jscpd.json
            # Separate config so JavaScript keeps its strict zero while Python
            # runs against a ratchet. See docs/RUNBOOK.md for the number and
            # why it may only be lowered.
            - name: Duplication, Python (jscpd)
              run: npx jscpd --config .jscpd.python.json
            - name: Link/route + XSS + a11y + dead-code + floating-promise + HTML-balance checks
              run: node tools/checks.mjs
            - name: Production cleanliness checks
              run: node tools/production-clean-check.mjs
            - name: JS payload budget
              run: node tools/js-budget.mjs
            - name: i18n catalog in sync (en.json generated from t() calls)
              run: node tools/i18n-extract.mjs --check
            # The format check translatewiki itself runs: every message documented
            # in qqq.json, and $1..$n parity between en.json and each translation.
            # Keys here are namespace.camelCase rather than MediaWiki's lowercase.
            - name: i18n message files (banana-checker)
              run: npm run lint:banana
            - name: Feature docs in sync (docs/FEATURES.md generated from experiments list)
              run: node tools/feature-docs.mjs --check
            - name: Unit tests + coverage gate
              run: npx vitest run --coverage
            # Mutation testing (Stryker) runs in its own workflow (.github/
            # workflows/mutation.yml) on a schedule + manual dispatch: a full-scope
            # run is ~60 min on the 2-core runner, too slow for a per-push gate.
            # Per-push protection is the unit suite + the coverage threshold gate.
            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium
            - name: E2E (smoke + a11y)
              run: npx playwright test

    python:
        name: Python quality
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.11"
            - run: pip install -r tools/python-quality-requirements.txt
            - name: Ruff lint
              run: ruff check proxy
            - name: Ruff format
              run: ruff format --check proxy
            - name: pip-audit
              run: pip-audit -r proxy/requirements.txt --strict
            - name: Proxy tests + whole-tree coverage ratchet
              run: |
                  pip install -r proxy/requirements.txt
                  PYTHONPATH=proxy pytest tests/proxy -q --cov --cov-report=term-missing
            # tests/tools was written and then run by nothing: this job named
            # tests/proxy only, and .aethyme/gates.toml triggered on the same path.
            # Six files, 39 tests, 3.6s -- guards for the deploy helpers, the
            # changelog freshness gate and the scheduler breaker, none of which
            # would have failed a build.
            - name: Deploy-tooling tests
              run: PYTHONPATH=proxy pytest tests/tools -q
            # Reported from the run above, so this costs no extra test time. The
            # reverse proxy and the static-file traversal guard stay at 100%
            # even though the tree as a whole is on a ratchet.
            # (the npm script of the same name is the local shorthand; this job
            # has no Node, so it calls coverage directly)
            - name: Reverse proxy stays fully covered
              run: coverage report --include='proxy/app.py,proxy/crawl.py' --fail-under=100

    secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            # No npm ci: a clean checkout has no node_modules, so gitleaks scans
            # only first-party files (the .gitleaks.toml allowlist covers the rest).
            - name: gitleaks (pinned, checksum-verified)
              env:
                  VERSION: "8.30.1"
              run: |
                  base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
                  asset="gitleaks_${VERSION}_linux_x64.tar.gz"
                  curl -sSfL "$base/$asset" -o "$asset"
                  curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
                  grep "  $asset\$" checksums.txt | sha256sum -c -
                  tar -xzf "$asset" gitleaks
                  ./gitleaks dir . -c .gitleaks.toml --redact --no-banner

    commitlint:
        name: Commit hygiene
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: commitlint
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: npx commitlint --from "$BASE" --to "$HEAD"
