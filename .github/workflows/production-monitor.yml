name: Production monitor

on:
    schedule:
        - cron: "7,22,37,52 * * * *"
    workflow_dispatch:
        inputs:
            exercise_alerts:
                description: Exercise every documented alert with synthetic unhealthy data
                required: false
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: production-monitor
    cancel-in-progress: false

jobs:
    probe:
        name: Probe production
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"
            - name: Exercise alert rules
              if: inputs.exercise_alerts
              run: python tools/check_production_health.py --exercise-alerts
            # Each scheduled run gets a fresh runner, so the previous scrape has to be
            # carried in a cache: the 5xx rule is evaluated over the interval between
            # runs, and without a baseline it would divide process-lifetime counters.
            # The key is unique per run and the prefix restores the newest earlier one,
            # which is the standard rolling-cache pattern for a mutable file.
            - name: Restore the previous scrape
              uses: actions/cache/restore@v6
              with:
                  path: production-window.json
                  key: production-monitor-window-${{ github.run_id }}
                  restore-keys: production-monitor-window-
            - name: Collect health and metrics
              run: python tools/check_production_health.py --output production-health.json --state production-window.json
            - name: Save this scrape as the next baseline
              if: always() && hashFiles('production-window.json') != ''
              uses: actions/cache/save@v6
              with:
                  path: production-window.json
                  key: production-monitor-window-${{ github.run_id }}
            - name: Preserve external snapshot
              if: always() && hashFiles('production-health.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: production-health-${{ github.run_id }}
                  path: production-health.json
                  retention-days: 30
