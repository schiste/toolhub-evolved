# Automated dependency updates. Keeps the pinned (exact-version) dev toolchain,
# CI actions, and the proxy's Python deps current, with security updates surfaced
# as PRs that run the full CI suite before they can merge.
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          npm-development:
              dependency-type: development
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      groups:
          github-actions:
              patterns: ["*"]
    - package-ecosystem: pip
      directory: "/proxy"
      schedule:
          interval: weekly
          day: monday
      groups:
          python-runtime:
              patterns: ["*"]
    - package-ecosystem: pip
      directory: "/tools"
      schedule:
          interval: weekly
          day: monday
      groups:
          python-quality:
              patterns: ["*"]
