# Dependabot configuration. Version-update pull requests are switched off for
# every ecosystem (`open-pull-requests-limit: 0`), which is GitHub's documented
# way to stop scheduled bumps while keeping security updates: those still arrive
# as PRs that run the full CI suite before they can merge. The four grouped
# update PRs open on 2026-09-09 were closed by hand, and Dependabot's own notice
# on a closed group PR says closing ignores nothing -- only configuration does.
version: 2
updates:
    - package-ecosystem: npm
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 0
      groups:
          npm-development:
              dependency-type: development
    - package-ecosystem: github-actions
      directory: "/"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 0
      groups:
          github-actions:
              patterns: ["*"]
    - package-ecosystem: pip
      directory: "/proxy"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 0
      groups:
          python-runtime:
              patterns: ["*"]
    - package-ecosystem: pip
      directory: "/tools"
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 0
      groups:
          python-quality:
              patterns: ["*"]
